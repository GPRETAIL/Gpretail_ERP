server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API traffic (/api) is routed by the Kubernetes ingress straight to the
    # gateway — this server only serves the static SPA bundle.

    # Vite emits content-hashed filenames under /assets — safe to cache forever
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: React Router owns all non-file paths
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain application/javascript text/css application/xml application/json image/svg+xml;
    gzip_comp_level 9;
    gzip_min_length 256;
    gzip_proxied any;
}
