name: Invoice AI Service

on:
  push:
    paths:
      - 'services/invoice-ai-service/**'
      - '.github/workflows/invoice-ai-service.yml'
  pull_request:
    paths:
      - 'services/invoice-ai-service/**'
      - '.github/workflows/invoice-ai-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/invoice-ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: services/invoice-ai-service
          push: false
          tags: vynerix/invoice-ai-service:test
