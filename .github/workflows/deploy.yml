name: CI/CD Pipeline & Hostinger Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v6
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Backend Test & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, curl
          coverage: none
      - name: Validate Composer Configuration
        working-directory: backend-laravel
        run: composer validate --strict
      - name: Install Composer Dependencies
        working-directory: backend-laravel
        run: composer install --prefer-dist --no-progress --no-interaction --ignore-platform-req=php+
      - name: Setup Test Environment
        working-directory: backend-laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Backend Tests
        working-directory: backend-laravel
        run: php artisan test --without-tty

  deploy-package:
    name: Build Deployment Package
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup PHP for Deployment Package
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, curl
          coverage: none
      - name: Install Production Composer Dependencies
        working-directory: backend-laravel
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --ignore-platform-req=php+
      - name: Download Frontend Build
        uses: actions/download-artifact@v7
        with:
          name: frontend-dist
          path: frontend-dist/
      - name: Prepare Deployment Package
        env:
          OCR_SPACE_API_KEY: ${{ secrets.OCR_SPACE_API_KEY }}
        run: |
          mkdir -p backend-laravel/public/
          cp -r frontend-dist/* backend-laravel/public/
          cp backend-laravel/.env.production.example backend-laravel/.env
          if [ -n "$OCR_SPACE_API_KEY" ]; then
            printf '\nOCR_SPACE_API_KEY=%s\n' "$OCR_SPACE_API_KEY" >> backend-laravel/.env
          fi
          mkdir -p backend-laravel/storage/framework/cache/data
          mkdir -p backend-laravel/storage/framework/sessions
          mkdir -p backend-laravel/storage/framework/views
          mkdir -p backend-laravel/storage/logs
          mkdir -p backend-laravel/bootstrap/cache
          chmod -R 777 backend-laravel/storage backend-laravel/bootstrap/cache
          cd backend-laravel
          zip -r ../deploy.zip . -x "*.git*" "node_modules/*" "tests/*"
          cd ..
      - name: Upload Deployment Artifact
        uses: actions/upload-artifact@v6
        with:
          name: hostinger-deployment-package
          path: deploy.zip
          retention-days: 7
      - name: Deployment Package Ready
        run: echo "Deployment package created successfully. Hostinger upload/authentication is not configured, so no remote upload is attempted."
