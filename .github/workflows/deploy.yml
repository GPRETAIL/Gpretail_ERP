name: CI/CD Pipeline & Hostinger Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint
      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test
      - name: Build Frontend Bundle
        working-directory: frontend
        run: npm run build
      - name: Upload Frontend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  backend:
    name: Backend Test & Validate
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, curl
          coverage: none
      - name: Validate Composer Configuration
        working-directory: backend-laravel
        run: composer validate --strict
      - name: Install Composer Dependencies
        working-directory: backend-laravel
        run: composer install --prefer-dist --no-progress --no-interaction
      - name: Setup Test Environment
        working-directory: backend-laravel
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Backend Tests
        working-directory: backend-laravel
        run: php artisan test --without-tty

  deploy:
    name: Deploy through SSH
    concurrency:
      group: gp-erp-production
      cancel-in-progress: false
    needs: [frontend, backend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      HOSTINGER_APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
    steps:
      - name: Require deploy key and pinned host identity
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          HOST_KEY_FINGERPRINT: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
        run: |
          test -n "$SSH_KEY" || { echo "::error::Configure HOSTINGER_SSH_KEY"; exit 1; }
          case "$HOST_KEY_FINGERPRINT" in
            SHA256:*) ;;
            *) echo "::error::Configure the verified HOSTINGER_SSH_FINGERPRINT"; exit 1 ;;
          esac
      - name: Check explicit deployment target
        run: |
          case "$HOSTINGER_APP_DIR" in
            /*) ;;
            *) echo "::error::Set HOSTINGER_APP_DIR to the absolute Laravel application directory containing artisan and .env"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_sqlite, pdo_mysql, bcmath, curl
          coverage: none
      - name: Install production dependencies
        working-directory: backend-laravel
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist/
      - name: Package application without secrets or runtime state
        run: |
          cp -r frontend-dist/* backend-laravel/public/
          tar -czf deploy.tar.gz --exclude='./.env' --exclude='./.env.*' --exclude='./storage' --exclude='./bootstrap/cache/*.php' --exclude='./tests' --exclude='./.git*' --exclude='./deploy.zip' --exclude='./deploy.tar.gz' -C backend-laravel .
      - name: Upload over SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          source: deploy.tar.gz
          target: ${{ secrets.HOSTINGER_APP_DIR }}
      - name: Extract and migrate using the existing server configuration
        uses: appleboy/ssh-action@v1.0.3
        env:
          APP_DIR: ${{ secrets.HOSTINGER_APP_DIR }}
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          fingerprint: ${{ secrets.HOSTINGER_SSH_FINGERPRINT }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          envs: APP_DIR
          script: |
            set -eu
            cd "$APP_DIR"
            test -f artisan && test -f .env && test -f composer.json
            PHP=/opt/alt/php84/usr/bin/php
            test -x "$PHP"
            tar -xzf deploy.tar.gz
            rm deploy.tar.gz
            $PHP artisan config:clear
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            $PHP artisan queue:restart
